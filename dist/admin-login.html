<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="robots" content="noindex,nofollow">
    <title>Admin Login | Zavora Fashion</title>
    <link rel="icon" type="image/png" href="assets/zavora-logo.png">
    <link rel="stylesheet" href="admin.css">
  </head>
  <body class="admin-login-body">
    <main class="admin-login-page">
      <section class="admin-login-card">
        <p class="admin-eyebrow">Hidden admin access</p>
        <img class="admin-login-logo" src="assets/zavora-logo.png" alt="Zavora Fashion">
        <h1>Zavora Admin</h1>
        <p>Secure login is protected by admin email, password, and an HttpOnly server session.</p>
        <form class="admin-form" data-admin-login-form autocomplete="off" novalidate onsubmit="return false;">
          <input name="email" type="email" placeholder="Admin email" autocomplete="username" data-lpignore="true" data-form-type="other" required>
          <input name="password" type="password" placeholder="Admin password" autocomplete="current-password" data-lpignore="true" data-form-type="other" required>
          <button class="primary-admin" type="button" data-admin-login-button>Sign In</button>
          <p class="admin-login-note" data-admin-login-note>Only configured admin credentials can open the control center.</p>
        </form>
      </section>
    </main>
    <script src="admin-login.js?v=20260731-fix-refresh"></script>
  </body>
</html>
